<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title id="pageTitle">BATCHI STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --red: #ff2b2b;
  --red-dark: #b30000;
  --red-glow: rgba(255,43,43,0.35);
  --bg: #0a0b10;
  --surface: #111320;
  --surface2: #181a28;
  --border: rgba(255,255,255,0.07);
  --text: #f0f0f0;
  --muted: #8a8ea8;
}

*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  overflow-x: hidden;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── CONTAINER ── */
.container {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  position: relative;
  z-index: 1;
  animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── HEADER ── */
.header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,11,16,0.8);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--red);
  text-shadow: 0 0 18px var(--red-glow), 0 0 40px rgba(255,43,43,0.15);
}

.logo span {
  color: white;
  opacity: 0.5;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 1px;
  font-weight: 400;
  margin-left: 6px;
  vertical-align: middle;
}

.menu {
  display: flex;
  gap: 4px;
}

.menu a {
  color: var(--muted);
  text-decoration: none;
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.5px;
  padding: 6px 12px;
  border-radius: 8px;
  transition: all 0.25s;
}

.menu a:hover { color: white; background: rgba(255,255,255,0.06); }

.menu a.active {
  color: white;
  background: var(--red);
  box-shadow: 0 0 14px var(--red-glow);
}

/* ── LIVE BADGE ── */
.live-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  background: rgba(255,43,43,0.07);
  border-bottom: 1px solid rgba(255,43,43,0.12);
  font-size: 11px;
  color: var(--muted);
}

.live-dot {
  width: 7px; height: 7px;
  background: #2dff7e;
  border-radius: 50%;
  box-shadow: 0 0 8px #2dff7e;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.5; transform:scale(1.3); }
}

.live-bar strong { color: white; }

/* ── SLIDER ── */
.slider-wrapper {
  position: relative;
  overflow: hidden;
  margin: 16px;
  border-radius: 20px;
  box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,0.6), 0 0 60px rgba(255,43,43,0.08);
  cursor: grab;
  user-select: none;
}

.slider-wrapper:active { cursor: grabbing; }

.slider {
  display: flex;
  transition: transform 0.45s cubic-bezier(0.25,1,0.5,1);
  will-change: transform;
}

.slide { min-width: 100%; position: relative; }

.slide img {
  width: 100%;
  display: block;
  border-radius: 20px;
  object-fit: cover;
  aspect-ratio: 4/3;
  transition: transform 0.3s;
}

.slide img:hover { transform: scale(1.015); }

/* slide counter */
.slide-count {
  position: absolute;
  bottom: 12px;
  right: 14px;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(8px);
  color: white;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
}

/* ARROWS */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px; height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  color: white;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.12);
}

.arrow:hover {
  background: var(--red);
  box-shadow: 0 0 14px var(--red-glow);
  border-color: transparent;
}

.left { left: 12px; }
.right { right: 12px; }

/* DOTS */
.dots {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin: 10px 0 4px;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.18);
  cursor: pointer;
  transition: all 0.3s;
}

.dot.active {
  width: 22px;
  background: var(--red);
  box-shadow: 0 0 8px var(--red-glow);
}

/* ── CONTENT ── */
.content { padding: 18px 16px 32px; }

/* BADGES ROW */
.badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.badge-red {
  background: rgba(255,43,43,0.15);
  color: var(--red);
  border: 1px solid rgba(255,43,43,0.3);
}

.badge-green {
  background: rgba(45,255,126,0.1);
  color: #2dff7e;
  border: 1px solid rgba(45,255,126,0.25);
}

.badge-gold {
  background: rgba(255,196,0,0.1);
  color: #ffc400;
  border: 1px solid rgba(255,196,0,0.25);
}

/* PRODUCT TITLE */
.title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1.1;
  margin-bottom: 4px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 14px;
}

/* PRICE BLOCK */
.price-block {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.price {
  font-family: 'Rajdhani', sans-serif;
  color: var(--red);
  font-size: 34px;
  font-weight: 700;
  text-shadow: 0 0 20px var(--red-glow);
  letter-spacing: 1px;
}

.price-old {
  color: var(--muted);
  font-size: 15px;
  text-decoration: line-through;
}

.discount-tag {
  background: rgba(255,43,43,0.15);
  color: var(--red);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255,43,43,0.25);
}

/* DIVIDER */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 18px 0;
}

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  transition: all 0.25s;
}

.stat-card:hover {
  border-color: rgba(255,43,43,0.3);
  background: var(--surface2);
  transform: translateY(-2px);
}

.stat-icon { font-size: 20px; margin-bottom: 5px; }

.stat-value {
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: white;
}

.stat-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.3px;
}

/* DETAIL CARDS */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.detail-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  transition: all 0.25s;
}

.detail-card:hover {
  border-color: rgba(255,43,43,0.25);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.detail-card-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.detail-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.detail-list li {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 12.5px;
  color: #c8cce0;
  line-height: 1.4;
}

.detail-list li::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--red);
  margin-top: 5px;
  flex-shrink: 0;
  box-shadow: 0 0 6px var(--red-glow);
}

/* GUARANTEE STRIP */
.guarantee {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin: 16px 0;
}

.guarantee-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}

.guarantee-icon { font-size: 18px; margin-bottom: 4px; }

.guarantee-label {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.3;
}

/* CTA BUTTON */
.cta-section { margin-top: 20px; }

.wa-btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 16px;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  font-family: 'Rajdhani', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--red), #cc0000);
  box-shadow: 0 6px 30px rgba(255,43,43,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.wa-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  transition: left 0.5s;
}

.wa-btn:hover::before { left: 100%; }

.wa-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 40px rgba(255,43,43,0.55);
}

.wa-btn:active { transform: translateY(0); }

.wa-btn-sub {
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  opacity: 0.8;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

/* SAFE BADGE */
.safe-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--muted);
}

/* ── IMAGE MODAL ── */
.image-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,0.94);
  justify-content: center;
  align-items: center;
  padding: 20px;
  backdrop-filter: blur(10px);
  animation: modalIn 0.2s ease both;
}

@keyframes modalIn {
  from { opacity:0; } to { opacity:1; }
}

.image-modal.show { display: flex; }

.modal-inner {
  position: relative;
  max-width: 520px;
  width: 100%;
  animation: scaleIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes scaleIn {
  from { transform: scale(0.88); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}

.image-modal img {
  width: 100%;
  border-radius: 18px;
  box-shadow: 0 0 60px rgba(255,43,43,0.2);
}

.close-btn {
  position: absolute;
  top: -14px; right: -14px;
  width: 36px; height: 36px;
  background: var(--red);
  border: none;
  border-radius: 50%;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 16px var(--red-glow);
  transition: transform 0.2s;
}

.close-btn:hover { transform: scale(1.15) rotate(90deg); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface2);
  border: 1px solid rgba(45,255,126,0.3);
  color: #2dff7e;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  z-index: 10000;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
  pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 20px 16px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}

.footer strong { color: var(--red); }
</style>

</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">BATCHI<span>STORE</span></div>
    <div class="menu">
      <a href="#" class="active">SPEK</a>
      <a href="#" target="_blank">STOK & TESTI</a>
    </div>
  </div>

  <!-- LIVE BAR (STATUS ATAS DINAMIS) -->
  <div class="live-bar">
    <div class="live-dot"></div>

  <!-- SLIDER -->

    <div class="slider" id="slider">

    </div>

    <div class="divider"></div>

    <!-- STATS -->

      <div class="stat-card">
        <div class="stat-icon">🎮</div>
        <div class="stat-value" id="skin">-</div>

      </div>

      <div class="stat-card">
        <div class="stat-icon">⚔️</div>
        <div class="stat-value" id="hero">-</div>
        <div class="stat-label">Hero</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏆</div>
        <div class="stat-value" id="emblem">-</div>
        <div class="stat-label">Emblem</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- DETAIL -->

      </div>

    </div>

    <!-- CTA -->

      <!-- STATUS BAWAH DINAMIS -->

        <strong id="statusBottom">READY STOCK</strong> —

      </div>

        💬 CHAT WHATSAPP
        <div class="wa-btn-sub">Fast Respon</div>
      </a>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 <strong>BATCHI STORE</strong>
  </div>

</div>

<!-- IMAGE MODAL -->
<div id="imageModal" class="image-modal" onclick="closeImage()">
  <div class="modal-inner">
    <button class="close-btn">✕</button>
    <img id="modalImg">
  </div>
</div>

<!-- SCRIPT -->
<script src="main.js"></script>
<script src="data1.js"></script>

</body>
